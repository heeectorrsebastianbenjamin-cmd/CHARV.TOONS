<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episodios - Charv Toons</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.logo.png">

  <!-- Fuente Retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Anton', 'Impact', sans-serif;
    }

    body {
      background-color: #d8d8d8;
      background-image: repeating-conic-gradient(
        from 0deg,
        #ececec 0deg 15deg,
        #dcdcdc 15deg 30deg
      );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      min-height: 90px;
      background-color: #802323;
      display: flex;
      align-items: center;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    .logo-container {
      width: 150px;
      height: 110px;
      background-color: #802323;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: 10px;
      top: 0;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
      border-bottom: 2px solid #000;
      border-right: 2px solid #000;
      overflow: hidden;
    }

    .logo-container img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    nav {
      margin-left: 170px;
      display: flex;
      height: 100%;
      width: 100%;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.6rem;
      letter-spacing: 1px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      border-right: 2px solid rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease;
      text-align: center;
    }

    nav a:hover, nav a.active {
      background-color: #601818;
    }

    main {
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .page-title {
      font-size: 3rem;
      color: #802323;
      text-shadow: 2px 2px 0px #000;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      width: 100%;
    }

    .episode-card {
      background-color: #ffca43;
      border: 4px solid #000;
      box-shadow: 6px 6px 0px #2a3851;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .episode-screen {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border: 3px solid #000;
      overflow: hidden;
    }

    .episode-screen embed, .episode-screen object, .episode-screen ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }

    .episode-footer {
      background-color: #2b3648;
      border: 3px solid #000;
      margin-top: 8px;
      padding: 10px;
      width: 100%;
      text-align: center;
      color: #fff;
    }

    .episode-footer h3 {
      font-size: 1.5rem;
      color: #ffca43;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      header {
        flex-direction: column;
        height: auto;
        padding-top: 10px;
      }
      .logo-container {
        position: relative;
        left: 0;
        top: 0;
        width: 120px;
        height: 85px;
        border-right: none;
        box-shadow: none;
        margin-bottom: 5px;
      }
      nav {
        margin-left: 0;
        flex-direction: column;
        width: 100%;
      }
      nav a {
        font-size: 1.3rem;
        padding: 12px 10px;
        width: 100%;
        border-right: none;
        border-top: 1px solid rgba(0, 0, 0, 0.3);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <a href="index.html"><img src="Logo charv toons.png" alt="Charv Toons Logo"></a>
    </div>
    <nav>
      <a href="protas.html">Conoce a los protas</a>
      <a href="episodios.html" class="active">Episodios</a>
      <a href="juegos.html">Juegos</a>
      <a href="https://heeectorrsebastianbenjamin-cmd.github.io/megamin-tv/" target="_blank" rel="noopener noreferrer">También disponible en Megamin</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">LISTA DE EPISODIOS</h1>

    <div class="episodes-grid">
      <!-- Episodio Pilot / Actual -->
      <div class="episode-card">
        <div class="episode-screen">
          <embed src="sebastian and hector.swf" type="application/x-shockwave-flash">
        </div>
        <div class="episode-footer">
          <h3>PILOTO: SEBASTIÁN Y HÉCTOR</h3>
        </div>
      </div>

      <!-- Próximo episodio Placeholder -->
      <div class="episode-card">
        <div class="episode-screen" style="display:flex; justify-content:center; align-items:center; color:#fff; font-size:1.5rem;">
          PRÓXIMAMENTE...
        </div>
        <div class="episode-footer">
          <h3>EPISODIO 1: EL RECREO</h3>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
