<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charv Toons - Octavo A</title>
  
  <!-- Ícono de la pestaña (Favicon real subido) -->
  <link rel="icon" type="image/png" href="favicon.logo.png">

  <!-- Fuente estilo Impact / Titular retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  
  <!-- Script de Ruffle para reproductor SWF -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Anton', 'Impact', sans-serif;
    }

    body {
      background-color: #d8d8d8;
      /* Fondo con rayos degradados estilo Flash */
      background-image: repeating-conic-gradient(
        from 0deg,
        #ececec 0deg 15deg,
        #dcdcdc 15deg 30deg
      );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Barra Superior / Header */
    header {
      width: 100%;
      min-height: 90px;
      background-color: #802323;
      display: flex;
      align-items: center;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    /* Logo Charv Toons */
    .logo-container {
      width: 150px;
      height: 110px;
      background-color: #802323;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: 10px;
      top: 0;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
      border-bottom: 2px solid #000;
      border-right: 2px solid #000;
      overflow: hidden;
    }

    .logo-container img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    /* Menú de Navegación */
    nav {
      margin-left: 170px;
      display: flex;
      height: 100%;
      width: 100%;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.6rem;
      letter-spacing: 1px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      border-right: 2px solid rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease;
      text-align: center;
    }

    nav a:hover {
      background-color: #601818;
    }

    /* Contenedor Principal (Sebastián a la izquierda, Reproductor a la derecha) */
    main {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-end;
      padding: 40px 20px;
      margin-top: 20px;
      position: relative;
    }

    /* Personaje Lateral (Sebastián) en el lado izquierdo */
    .character-container {
      width: 35%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .character-container img {
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    /* Reproductor de SWF / Pantalla de Inicio en el lado derecho */
    .screen-container {
      width: 60%;
      background-color: #ffca43;
      border: 4px solid #000;
      padding: 12px;
      box-shadow: 6px 6px 0px #2a3851;
    }

    .screen-inner {
      background-color: #313d4e;
      border: 3px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 3px solid #000;
      overflow: hidden;
      position: relative;
    }

    .video-box embed, 
    .video-box object,
    .video-box ruffle-embed,
    .video-box ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }

    .screen-footer {
      width: 100%;
      padding: 10px 0;
      text-align: center;
      background-color: #2b3648;
    }

    .screen-footer h2 {
      color: #ffffff;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 📱 DISEÑO RESPONSIVO PARA CELULARES Y TABLETS */
    @media (max-width: 820px) {
      header {
        flex-direction: column;
        height: auto;
        padding-top: 10px;
      }

      .logo-container {
        position: relative;
        left: 0;
        top: 0;
        width: 120px;
        height: 85px;
        border-right: none;
        box-shadow: none;
        margin-bottom: 5px;
      }

      nav {
        margin-left: 0;
        flex-direction: column;
        width: 100%;
      }

      nav a {
        font-size: 1.3rem;
        padding: 12px 10px;
        width: 100%;
        border-right: none;
        border-top: 1px solid rgba(0, 0, 0, 0.3);
      }

      main {
        flex-direction: column;
        align-items: center;
        padding: 15px 10px;
        gap: 25px;
      }

      .screen-container {
        width: 100%;
        max-width: 500px;
        box-shadow: 4px 4px 0px #2a3851;
        padding: 8px;
      }

      .character-container {
        width: 100%;
      }

      .character-container img {
        max-width: 250px;
      }

      .screen-footer h2 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con logo y menú -->
  <header>
    <div class="logo-container">
      <a href="index.html"><img src="Logo charv toons.png" alt="Charv Toons Logo"></a>
    </div>
    <nav>
      <a href="protas.html">Conoce a los protas</a>
      <a href="episodios.html">Episodios</a>
      <a href="juegos.html">Juegos</a>
      <a href="https://heeectorrsebastianbenjamin-cmd.github.io/megamin-tv/" target="_blank" rel="noopener noreferrer">También disponible en Megamin</a>
    </nav>
  </header>

  <!-- Cuerpo de la página -->
  <main>
    <!-- Personaje Sebastián (a la izquierda en PC) -->
    <div class="character-container">
      <img src="sebis_what.png" alt="Sebastián Charv Toons">
    </div>

    <!-- Pantalla central ejecutando la animación SWF (a la derecha en PC) -->
    <div class="screen-container">
      <div class="screen-inner">
        <div class="video-box">
          <embed src="Hectorsebastian.swf" type="application/x-shockwave-flash">
        </div>
        <div class="screen-footer">
          <h2>NUEVO</h2>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
