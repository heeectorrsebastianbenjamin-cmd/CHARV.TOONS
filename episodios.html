<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARV TOONS - Inicio</title>
    <!-- Carga del reproductor Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Barra de navegación superior */
        header {
            width: 100%;
            background-color: #800000;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            border-bottom: 4px solid #4a0000;
        }

        .logo-nav {
            height: 60px;
            margin-right: 30px;
            cursor: pointer;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-right: 20px;
            text-transform: uppercase;
        }

        nav a:hover {
            color: #ffcccc;
        }

        /* Contenedor Principal (Personaje + Reproductor SWF) */
        .main-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            max-width: 1200px;
            width: 100%;
        }

        /* Personaje Sebis What */
        .character-box img {
            max-height: 480px;
            height: auto;
            display: block;
        }

        /* Marco del Reproductor Flash */
        .player-frame {
            width: 640px;
            height: 480px;
            background-color: #000000;
            border: 4px solid #111111;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            position: relative;
        }

        #ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Encabezado con logo y links -->
    <header>
        <a href="index.html">
            <img src="logo.png" alt="CHARV TOONS" class="logo-nav" onerror="this.style.display='none'">
        </a>
        <nav>
            <a href="protas.html">CONOCE A LOS PROTAS</a>
            <a href="episodios.html">EPISODIOS</a>
            <a href="juegos.html">JUEGOS</a>
        </nav>
    </header>

    <!-- Sección central con personaje y reproductor SWF -->
    <div class="main-container">
        
        <!-- Imagen Sebis What -->
        <div class="character-box">
            <img src="sebis what.png" alt="Sebis What">
        </div>

        <!-- Carga de Hectorsebastian.swf vía Ruffle -->
        <div class="player-frame">
            <div id="ruffle-player"></div>
        </div>

    </div>

    <!-- Script de inicialización para Ruffle -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player");
            
            container.appendChild(player);
            
            // Carga de la animación SWF exacta
            player.load("Hectorsebastian.swf");
        });
    </script>

</body>
</html>
