<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARV TOONS - Inicio</title>
    <!-- Script Oficial de Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Encabezado Rojo Superior */
        header {
            width: 100%;
            background-color: #800000;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            border-bottom: 4px solid #4a0000;
        }

        .logo-nav {
            height: 60px;
            margin-right: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-right: 20px;
            text-transform: uppercase;
        }

        nav a:hover {
            color: #ffcccc;
        }

        /* Contenedor Central */
        .main-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 1200px;
        }

        /* Personaje Sebis What */
        .character-box img {
            max-height: 450px;
            width: auto;
            display: block;
        }

        /* Marco Amarillo del Reproductor SWF */
        .player-frame {
            width: 640px;
            height: 480px;
            background-color: #000000;
            border: 4px solid #f2ab1c;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            position: relative;
        }

        ruffle-embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Encabezado con navegación -->
    <header>
        <a href="index.html">
            <img src="logo.png" alt="CHARV TOONS" class="logo-nav" onerror="this.style.display='none'">
        </a>
        <nav>
            <a href="protas.html">CONOCE A LOS PROTAS</a>
            <a href="episodios.html">EPISODIOS</a>
            <a href="juegos.html">JUEGOS</a>
            <a href="#">TAMBIÉN DISPONIBLE EN MEGAMIN</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <div class="main-container">
        
        <!-- Imagen de Sebis (Con respaldo automático por si tiene o no espacios) -->
        <div class="character-box">
            <img src="sebis_what.png" alt="Sebis What" onerror="this.src='sebiswhat.png'; this.onerror=function(){this.src='sebis_what.png';}">
        </div>

        <!-- Incrustación Nativa e Infalible de Ruffle -->
        <div class="player-frame">
            <ruffle-embed src="Hectorsebastian.swf" width="100%" height="100%" allowfullscreen="true"></ruffle-embed>
        </div>

    </div>

</body>
</html>
