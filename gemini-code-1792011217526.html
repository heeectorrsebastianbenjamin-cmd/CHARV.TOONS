<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charv Toons - Octavo A</title>
  <!-- Fuente estilo Impact / Titular retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Anton', 'Impact', sans-serif;
    }

    body {
      background-color: #d8d8d8;
      /* Fondo con rayos degradados estilo Flash */
      background-image: repeating-conic-gradient(
        from 0deg,
        #ececec 0deg 15deg,
        #dcdcdc 15deg 30deg
      );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Barra Superior / Header */
    header {
      width: 100%;
      height: 90px;
      background-color: #802323;
      display: flex;
      align-items: center;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    /* Logo Charv Toons */
    .logo-container {
      width: 150px;
      height: 110px;
      background-color: #802323;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: 10px;
      top: 0;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
      border-bottom: 2px solid #000;
      border-right: 2px solid #000;
    }

    .logo-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    /* Menú de Navegación */
    nav {
      margin-left: 170px;
      display: flex;
      height: 100%;
      width: 100%;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 2rem;
      letter-spacing: 1.5px;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      border-right: 2px solid rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease;
    }

    nav a:hover {
      background-color: #601818;
    }

    /* Contenedor Principal */
    main {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 40px 20px;
      margin-top: 20px;
      position: relative;
    }

    /* Personaje Lateral */
    .character-container {
      width: 35%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .character-container img {
      width: 100%;
      max-width: 320px;
      height: auto;
    }

    /* Reproductor de Video / Pantalla de Inicio */
    .screen-container {
      width: 60%;
      background-color: #ffca43;
      border: 4px solid #000;
      padding: 12px;
      box-shadow: 6px 6px 0px #2a3851;
    }

    .screen-inner {
      background-color: #313d4e;
      border: 3px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-box {
      width: 100%;
      height: 320px;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 3px solid #000;
    }

    .video-box iframe, 
    .video-box video {
      width: 100%;
      height: 100%;
      border: none;
    }

    .screen-footer {
      width: 100%;
      padding: 10px 0;
      text-align: center;
      background-color: #2b3648;
    }

    .screen-footer h2 {
      color: #ffffff;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Responsivo para celulares */
    @media (max-width: 768px) {
      header {
        height: auto;
        flex-direction: column;
      }
      .logo-container {
        position: relative;
        width: 100%;
        height: 80px;
      }
      nav {
        margin-left: 0;
        flex-direction: column;
      }
      main {
        flex-direction: column-reverse;
        align-items: center;
      }
      .character-container, .screen-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con logo y menú -->
  <header>
    <div class="logo-container">
      <!-- Reemplaza con la ruta de tu logo -->
      <img src="logo_charvtoons.png" alt="Charv Toons Logo">
    </div>
    <nav>
      <a href="#protas">Conoce a los protas</a>
      <a href="#episodios">Episodios</a>
      <a href="#juegos">Juegos</a>
    </nav>
  </header>

  <!-- Cuerpo de la página -->
  <main>
    <!-- Personaje a la izquierda -->
    <div class="character-container">
      <!-- Reemplaza con la imagen transparente del personaje -->
      <img src="personaje.png" alt="Personaje Charv Toons">
    </div>

    <!-- Pantalla central para los episodios -->
    <div class="screen-container">
      <div class="screen-inner">
        <div class="video-box">
          <!-- Puedes usar un tag <video> o un <iframe> de YouTube aquí -->
          <iframe src="https://www.youtube.com/embed/TU_ID_DE_YOUTUBE" allowfullscreen></iframe>
        </div>
        <div class="screen-footer">
          <h2>NUEVO</h2>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
